# Канал Forge: Postgres (очередь ответов + журнал отправленного) и бот, который
# владеет токеном единолично.
#
# Имя compose-проекта = имя каталога, поэтому держи канал в отдельной папке: свой
# Postgres, свой том, никакого пересечения с чужими стеками на том же хосте.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай в .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      # Зацепка для внешнего бэкап-скрипта, если он у тебя есть: по этой метке он
      # находит базу канала. Без неё очередь ответов в бэкап не попадёт.
      - "backup.pgdump=true"
    # Наружу порт БД не публикуем: к ней ходит только бот по внутренней сети.

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?задай в .env}
      FORGE_SECRET: ${FORGE_SECRET:?задай в .env}
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:?задай в .env}
      API_PORT: 8090
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
    ports:
      # Порт наружу — сюда стучится Claude Code. При запуске на своей же машине
      # достаточно localhost.
      # ВАЖНО: Docker Desktop при старте вешает inbound-BLOCK на свой backend, и
      # порт перестаёт отвечать с других хостов (локально при этом работает —
      # это путает диагностику). Лечение — keep-port-open.ps1 рядом, поставленный
      # задачей планировщика. Актуально только для Windows и только если канал
      # стоит не на той машине, откуда идёт стройка.
      - "${API_HOST_PORT:-8090}:8090"
    healthcheck:
      # Проверка снаружи процесса — единственная, которая ловит зависание целиком.
      # Внутренний /healthz честен, когда отвечает: он отдаёт 503 на выбитый опрос.
      # Но 19.08.2026 процесс завис, и он не отдал ничего — ни 503, ни 200, — а
      # контейнер остался Up, потому что процесс не падал. Docker без healthcheck о
      # таком не узнаёт, и restart: unless-stopped не срабатывает.
      # start_period даёт подняться опросу: до первой удачной выборки /healthz
      # отвечает 503 законно, и без отсрочки контейнер перезапускался бы по кругу.
      # Проверка на Python, а не curl: образ бота — python:3.12-slim, curl в нём
      # нет (проверено запуском), и healthcheck на curl уводил бы в unhealthy
      # исправный контейнер. urlopen поднимает исключение и на 503, и на обрыв
      # соединения — то есть оба вида отказа дают ненулевой код.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
